<head>

<title>家居面板 · Home Panel</title>
<style>
:root{--u:min(1vmin,.7vw);--bg:#0b0f14;--card:#141a22;--card2:#0f141b;--line:#263040;--fg:#eef2f6;--mute:#8a96a6;--ok:#3fd08a;--acc:#6cb6ff;--bad:#ff6b6b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,"PingFang HK","PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif;-webkit-user-select:none;user-select:none;overflow:hidden;-webkit-text-size-adjust:100%}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:calc(1.6*var(--u));padding:max(calc(2*var(--u)),env(safe-area-inset-top)) max(calc(2*var(--u)),env(safe-area-inset-right)) max(calc(1.6*var(--u)),env(safe-area-inset-bottom)) max(calc(2*var(--u)),env(safe-area-inset-left))}
.col{display:flex;flex-direction:column;gap:calc(1.6*var(--u));min-height:0;min-width:0}
.busico{width:calc(2.6*var(--u));height:calc(2.6*var(--u));vertical-align:-calc(.5*var(--u));margin-right:calc(.8*var(--u))}
.card{background:var(--card);border:1px solid var(--line);border-radius:calc(2.2*var(--u));padding:calc(2.2*var(--u));min-height:0;display:flex;flex-direction:column;overflow:hidden}
.h{font-size:calc(2*var(--u));color:var(--mute);letter-spacing:.08em;margin-bottom:calc(1.2*var(--u));display:flex;justify-content:space-between;align-items:center;text-transform:uppercase}
/* clock */
#clockCard{position:relative}
#clock{font-size:calc(17.5*var(--u));font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.03em;line-height:.95}
#clock .side{display:inline-flex;flex-direction:column;justify-content:space-between;vertical-align:top;margin-left:calc(1.2*var(--u));height:calc(15*var(--u));letter-spacing:0}
#clock .ap{font-size:calc(4.2*var(--u));color:#c3ccd7;font-weight:600;line-height:1.1;padding-top:calc(1.2*var(--u))}
#clock .sec{font-size:calc(6*var(--u));color:var(--mute);font-weight:500;line-height:1}
#date{font-size:calc(3.6*var(--u));color:#c3ccd7;margin-top:calc(.8*var(--u))}
.gear{position:absolute;top:calc(1.4*var(--u));right:calc(1.4*var(--u));font-size:calc(4*var(--u));line-height:1;background:none;border:0;color:var(--mute);padding:calc(1*var(--u));cursor:pointer}
/* weather */
#wxCard{flex:1}
.now{display:flex;align-items:center;gap:calc(2*var(--u))}
.temp{font-size:calc(16.8*var(--u));font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.temp sup{font-size:calc(6*var(--u));vertical-align:top;margin-left:calc(.4*var(--u))}
.wxi{width:calc(14.4*var(--u));height:calc(14.4*var(--u));object-fit:contain}
.meta{font-size:calc(2.8*var(--u));color:var(--mute);line-height:1.55;white-space:nowrap}
.meta b{color:var(--fg);font-weight:600}
.desc{font-size:calc(2.3*var(--u));line-height:1.4;margin:calc(1*var(--u)) 0;color:#c9d2dc;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 7-day forecast: compact rows that share the remaining height */
.fc{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;background:var(--card2);border-radius:calc(1.4*var(--u));padding:calc(.2*var(--u)) calc(1.4*var(--u))}
.fr{display:grid;grid-template-columns:calc(6.5*var(--u)) calc(4.6*var(--u)) 1fr auto auto;column-gap:calc(1.2*var(--u));align-items:center;padding:calc(.2*var(--u)) 0;border-top:1px solid var(--line)}
.fr:first-child{border-top:0}
.fday{font-size:calc(2.3*var(--u));font-weight:600;line-height:1.15}
.fday small{display:block;font-size:calc(1.7*var(--u));color:var(--mute);font-weight:400}
.fr img{width:calc(4.6*var(--u));height:calc(4.6*var(--u));object-fit:contain}
.ftxt{font-size:calc(1.9*var(--u));line-height:1.25;color:#b9c3cf;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ftmp{text-align:right;font-size:calc(2.3*var(--u));font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.1}
.ftmp span{display:block}
.ftmp span{color:var(--mute)}
.psr{display:inline-block;font-size:calc(1.6*var(--u));border-radius:calc(.8*var(--u));padding:0 calc(.7*var(--u));margin-left:0;vertical-align:middle;min-width:calc(8.5*var(--u));text-align:center;background:#1e2733;color:#9fb0c3}
.psr.p2{background:#1b3350;color:#9cc8ff}.psr.p3{background:#1d4b7a;color:#cfe5ff}.psr.p4{background:#2463a8;color:#fff}.psr.p5{background:#2f7de1;color:#fff}
/* warnings */
#warn{display:flex;flex-wrap:wrap;gap:calc(1.2*var(--u))}
.wb{display:flex;align-items:center;gap:calc(1.4*var(--u));background:var(--card2);border-radius:calc(1.6*var(--u));padding:calc(.9*var(--u)) calc(1.8*var(--u)) calc(.9*var(--u)) calc(.9*var(--u));border:2px solid var(--line)}
.badge{min-width:calc(7.5*var(--u));height:calc(7.5*var(--u));border-radius:calc(1.2*var(--u));display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(3*var(--u));padding:0 calc(1.1*var(--u));white-space:nowrap;border:2px solid transparent}
.badge.wimg{background:none;border:0;padding:0}
.badge.wimg img{width:100%;height:100%;object-fit:contain;image-rendering:auto}
.badge.tc{font-size:calc(4.6*var(--u))}
.wname{font-size:calc(2.6*var(--u));font-weight:600;line-height:1.25}
.wtime{font-size:calc(1.9*var(--u));color:var(--mute);margin-top:calc(.3*var(--u))}
.nowarn{color:var(--ok);font-size:calc(2.8*var(--u));display:flex;align-items:center;gap:calc(1.2*var(--u))}
.nowarn:before{content:"";width:calc(1.6*var(--u));height:calc(1.6*var(--u));border-radius:50%;background:var(--ok)}
.wb.sev{border-color:var(--bad);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 calc(.8*var(--u)) rgba(255,107,107,.25)}}
/* bus */
#busCard{flex:0 1 auto}
#radarCard{flex:1;min-height:calc(16*var(--u));flex-direction:row;gap:calc(2*var(--u));padding:calc(1.6*var(--u))}
.rmap{flex:none;height:100%;min-height:calc(14*var(--u));aspect-ratio:1/1;overflow:hidden;position:relative;border-radius:calc(1.2*var(--u));background:#6b6fc7}
.rmap img{position:absolute;left:0;top:0;height:100%;width:auto;opacity:0}
.rmap img.on{opacity:1}
.rinfo{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-end;text-align:right}
.rsub{font-size:calc(1.9*var(--u));color:var(--mute);margin-top:calc(.4*var(--u))}
.rtime{font-size:calc(5.2*var(--u));font-weight:700;font-variant-numeric:tabular-nums;margin-top:calc(1.2*var(--u));line-height:1}
.rdots{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:calc(.6*var(--u));margin-top:calc(1.2*var(--u))}
.rdots i{width:calc(1.1*var(--u));height:calc(1.1*var(--u));border-radius:50%;background:#2c3748}
.rdots i.on{background:var(--acc)}
.rinfo #foot{margin-top:auto;font-size:calc(1.4*var(--u));line-height:1.35}
#bus{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0}
.stopname{font-size:calc(2.4*var(--u));font-weight:600;color:var(--acc);margin:calc(.8*var(--u)) 0 calc(.2*var(--u));display:flex;justify-content:space-between;align-items:baseline;gap:calc(2*var(--u))}
.stopname .then{color:#aab4c0;font-weight:500;font-size:calc(2.2*var(--u));white-space:nowrap}
.stopname .then b{color:var(--fg);font-size:calc(2.8*var(--u));font-weight:700}
.stopname{border-top:1px solid var(--line);padding-top:calc(.8*var(--u))}
.stopname:first-child{margin-top:0;border-top:0;padding-top:0}
.row{display:grid;grid-template-columns:var(--rtw,calc(11.5*var(--u))) minmax(0,1fr) auto;align-items:center;gap:calc(1.4*var(--u));padding:calc(.3*var(--u)) 0}
.rt{font-size:calc(11*var(--u));font-weight:800;line-height:1;letter-spacing:-.02em;white-space:nowrap}
.rt span{display:inline-block}
.rt.mid{font-size:calc(9.1*var(--u))}
.rt.long{font-size:calc(7.5*var(--u));letter-spacing:-.03em}
.dest{font-size:calc(2.6*var(--u));line-height:1.25;min-width:0}
.dest small{display:block;color:var(--mute);font-size:calc(1.9*var(--u));margin-top:calc(.3*var(--u))}
.etas{display:flex;gap:calc(2*var(--u));align-items:center;justify-content:flex-end}
.more{font-size:calc(2.6*var(--u));color:#aab4c0;font-weight:600;line-height:1.2;text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
.more small{display:block;font-size:calc(1.9*var(--u));color:var(--mute);font-weight:500}
.eta{font-size:calc(9.9*var(--u));font-weight:700;font-variant-numeric:tabular-nums;line-height:1;text-align:right;min-width:calc(12*var(--u))}
.eta small{font-size:calc(3.9*var(--u));font-weight:500;color:var(--mute);margin-left:calc(.4*var(--u))}
.eta.l{font-size:calc(5.3*var(--u));color:#aab4c0;font-weight:600;min-width:calc(6.5*var(--u))}
.eta.l small{font-size:calc(2.8*var(--u))}
.eta.arr{color:var(--ok);font-size:calc(7.1*var(--u))}
.eta.sch{opacity:.75}
.none{font-size:calc(2.4*var(--u));color:var(--mute)}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(2*var(--u));color:var(--mute);font-size:calc(3*var(--u));text-align:center}
.btn{background:#1f6feb;color:#fff;border:0;border-radius:calc(1.4*var(--u));padding:calc(1.4*var(--u)) calc(3*var(--u));font-size:calc(2.6*var(--u));font-weight:600;cursor:pointer}
#foot{font-size:calc(1.7*var(--u));color:var(--mute);display:flex;gap:calc(2*var(--u));flex-wrap:wrap;margin-top:calc(1*var(--u))}
#foot .err{color:var(--bad)}
#dim{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 3s}
/* settings */
#set{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:calc(3*var(--u));z-index:5}
#set.open{display:flex}
.panel{background:#121820;border:1px solid var(--line);border-radius:16px;width:min(760px,100%);max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:22px;font-size:17px;-webkit-user-select:text;user-select:text}
.panel h2{font-size:22px;margin-bottom:14px}
.panel h3{font-size:15px;color:var(--mute);margin:20px 0 8px;font-weight:600;letter-spacing:.04em}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;color:var(--fg);padding:9px 18px;font-size:16px;cursor:pointer}
.seg button.on{background:#1f6feb}
.inp{display:flex;gap:8px;flex-wrap:wrap}
.inp input,.panel select{flex:1;min-width:200px;background:#0b0f14;border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:16px}
.sbtn{background:#263040;color:var(--fg);border:0;border-radius:10px;padding:10px 16px;font-size:16px;cursor:pointer}
.sbtn.pri{background:#1f6feb;color:#fff}
.sbtn.del{background:#3a1d22;color:#ffb3b3}
.res{margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.res div{padding:10px 12px;border-top:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.res div:first-child{border-top:0}
.res div:active{background:#1b2430}
.res small{color:var(--mute)}
.res small.dests{display:block;font-size:13px;margin-top:3px;line-height:1.35}
.res div.added{background:#13261c}
.sel{border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:10px}
.sel .top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:#0b0f14;color:var(--fg);border-radius:999px;padding:6px 12px;font-size:15px;cursor:pointer}
.chip.on{background:#1f6feb;border-color:#1f6feb}
.chip small{color:var(--mute);margin-left:4px}
.chip.on small{color:#d6e4ff}
.hint{color:var(--mute);font-size:14px;margin-top:6px}
.chk{display:flex;align-items:center;gap:10px}
.chk input{width:22px;height:22px}
.link{word-break:break-all;font-size:13px;color:var(--mute);background:#0b0f14;border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:6px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
</style>
</head>

  <div class="col">
    <div class="card" id="warnCard">

</div>
<div id="dim"></div>
<div id="set"><div class="panel" id="panel"></div></div>

    if (search.results) {
      h += search.results.length ? '<div class="res">' + search.results.map(function (s) {
        var added = cfg.stops.some(function (x) { return x.id === s.stop; });
        var rs = stopRoutes[s.stop];
        var hint = rs === 'err' ? '' : !rs ? '…' : rs.length ? rs.slice(0, 6).map(function (r) { return r.route + ' ' + t('to') + (isEn() ? r.dest_en : r.dest_tc); }).join(' · ') + (rs.length > 6 ? ' …' : '') : t('noEta');
        return '<div data-act="add" data-id="' + esc(s.stop) + '"' + (added ? ' class="added"' : '') + '><span>' + (added ? '✓ ' : '') + esc(isEn() ? s.name_en : s.name_tc) +
          (hint ? '<small class="dests">' + esc(hint) + '</small>' : '') + '</span><small>' + (s.d != null ? Math.round(s.d) + ' ' + esc(t('m')) : '') + '</small></div>';
      }).join('') + '</div>' : '<div class="hint">' + esc(t('none')) + '</div>';
    }

    cfg.stops.forEach(function (s, i) {
      h += '<div class="sel"><div class="top"><span>' + esc(isEn() ? s.en : s.tc) + '</span><button class="sbtn del" data-act="rm" data-i="' + i + '">' + esc(t('remove')) + '</button></div>';
      h += '<div class="inp" style="margin-top:8px"><input class="lbl" data-i="' + i + '" value="' + esc(s.label || '') + '" placeholder="' + esc(t('labelPh')) + '"></div>';
      var rs = routesAt(s);
      if (!rs) {
        h += '<div class="hint">' + esc(t('loading')) + '</div>';
        if (!(s.id in stopRoutes)) loadStopRoutes(s.id).then(renderSet);
      } else if (rs === 'err') {
        h += '<div class="hint">' + esc(t('busy')) + '</div>';
      } else {
        h += '<div class="hint">' + esc(t('routes')) + '</div><div class="chips">' + rs.map(function (r) {
          var on = s.routes && s.routes.indexOf(r.k) >= 0, dest = isEn() ? r.dest_en : r.dest_tc;
          return '<button class="chip' + (on ? ' on' : '') + '" data-act="chip" data-i="' + i + '" data-k="' + esc(r.k) + '">' + esc(r.route) + (dest ? '<small>' + esc(t('to')) + ' ' + esc(dest) + '</small>' : '') + '</button>';
        }).join('') + '</div><div class="hint">' + esc(t('routesNote')) + '</div>';
      }
      h += '</div>';
    });

    var temps = (data.now && data.now.temperature && data.now.temperature.data) || [];
    if (temps.length) {
      h += '<h3>' + esc(t('station')) + '</h3><select id="station"><option value="-1">' + esc(t('hko')) + '</option>' +
        temps.map(function (x, i) { return '<option value="' + i + '"' + (cfg.station === i ? ' selected' : '') + '>' + esc(x.place) + '</option>'; }).join('') + '</select>';
    }
    h += '<h3>&nbsp;</h3><label class="chk"><input type="checkbox" id="dimchk"' + (cfg.dim ? ' checked' : '') + '> ' + esc(t('dim')) + '</label>';

    saveCfg();
    h += '<h3>' + esc(t('link')) + '</h3><div class="link" id="lnk">' + esc(location.href) + '</div>' +
      '<div class="actions"><button class="sbtn" data-act="copy">' + esc(t('copy')) + '</button><button class="sbtn pri" data-act="close">' + esc(t('done')) + '</button></div>';
    var q = $('q') ? $('q').value : '';
    $('panel').innerHTML = h;
    if (q && $('q')) $('q').value = q;
    var st = $('station'); if (st) st.onchange = function () { cfg.station = parseInt(st.value, 10); saveCfg(); renderWx(); };
    var dc = $('dimchk'); if (dc) dc.onchange = function () { cfg.dim = dc.checked; saveCfg(); tick(); };
    Array.prototype.forEach.call(document.querySelectorAll('.lbl'), function (el) {
      el.oninput = function () { cfg.stops[+el.getAttribute('data-i')].label = el.value.trim(); saveCfg(); renderBus(); };
    });
    var rqi = $('rq'); if (rqi) rqi.onkeydown = function (e) { if (e.key === 'Enter') doRouteFind(); };
    var qi = $('q'); if (qi) qi.onkeydown = function (e) { if (e.key === 'Enter') doFind(); };
  }

  function hintResults() {
    (search.results || []).slice(0, 15).forEach(function (r) {
      if (!(r.stop in stopRoutes)) loadStopRoutes(r.stop).then(function () { if ($('set').className === 'open') renderSet(); });
    });
  }
  function doFind() {
    var q = ($('q') && $('q').value || '').trim().toLowerCase();
    if (!q) return;
    search.msg = t('loading'); search.results = null; renderSet(); $('q').value = q;
    ensureStops().then(function (all) {
      search.msg = '';
      search.results = all.filter(function (s) { return (s.name_tc || '').toLowerCase().indexOf(q) >= 0 || (s.name_en || '').toLowerCase().indexOf(q) >= 0; }).slice(0, 15);
      hintResults();
      renderSet(); if ($('q')) $('q').value = q;
    }).catch(function () { search.msg = t('busy'); renderSet(); });
  }
  function doNear() {
    if (!navigator.geolocation) { search.msg = t('locErr'); renderSet(); return; }
    search.msg = t('loading'); search.results = null; renderSet();
    navigator.geolocation.getCurrentPosition(function (pos) {
      var la = pos.coords.latitude, lo = pos.coords.longitude;
      ensureStops().then(function (all) {
        search.msg = '';
        search.results = all.map(function (s) { return Object.assign({ d: dist(la, lo, parseFloat(s.lat), parseFloat(s.long)) }, s); })
          .sort(function (a, b) { return a.d - b.d; }).slice(0, 12);
        hintResults();
        renderSet();
      }).catch(function () { search.msg = t('busy'); renderSet(); });
    }, function () { search.msg = t('locErr'); renderSet(); }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  }
  // ---- add a single route at one stop ----
  var rsearch = { route: '', dirs: null, msg: '' };
  function stopNames(ids) {
    return ensureStops().then(function (all) {
      var m = {}; all.forEach(function (s) { m[s.stop] = s; }); return m;
    }, function () {
      var m = {};
      return Promise.all(ids.map(function (id) {
        return getJSON(KMB + '/stop/' + id).then(function (d) { if (d && d.data) m[id] = d.data; }, function () {});
      })).then(function () { return m; });
    });
  }
  function doRouteFind() {
    var r = (($('rq') && $('rq').value) || '').trim().toUpperCase();
    if (!r) return;
    rsearch = { route: r, dirs: null, msg: t('loading') }; renderSet();
    var dirs = [['outbound', 'O'], ['inbound', 'I']];
    Promise.all(dirs.map(function (d) {
      return Promise.all([
        getJSON(KMB + '/route/' + encodeURIComponent(r) + '/' + d[0] + '/1').catch(function () { return null; }),
        getJSON(KMB + '/route-stop/' + encodeURIComponent(r) + '/' + d[0] + '/1').catch(function () { return null; })
      ]).then(function (x) {
        var info = x[0] && x[0].data, list = (x[1] && x[1].data) || [];
        if (!list.length) return null;
        return { dir: d[1], st: 1, dest_tc: info && info.dest_tc, dest_en: info && info.dest_en, raw: list };
      });
    })).then(function (res) {
      res = res.filter(Boolean);
      if (!res.length) { rsearch.msg = t('noRoute'); renderSet(); return; }
      var ids = []; res.forEach(function (d) { d.raw.forEach(function (x) { ids.push(x.stop); }); });
      return stopNames(ids).then(function (m) {
        res.forEach(function (d) {
          d.stops = d.raw.map(function (x) { var s = m[x.stop] || {}; return { id: x.stop, seq: x.seq, tc: s.name_tc || x.stop, en: s.name_en || x.stop }; });
        });
        rsearch.dirs = res; rsearch.msg = t('pickStop'); renderSet();
      });
    }).catch(function () { rsearch.msg = t('busy'); renderSet(); });
  }
  function addRouteStop(id, key) {
    var st = null;
    (rsearch.dirs || []).forEach(function (d) { d.stops.forEach(function (x) { if (x.id === id) st = x; }); });
    if (!st) return;
    var ex = null;
    cfg.stops.forEach(function (x) { if (x.id === id && x.routes && x.routes.length) ex = x; });
    if (ex) { if (ex.routes.indexOf(key) < 0) ex.routes.push(key); }
    else cfg.stops.push({ id: id, tc: st.tc, en: st.en, routes: [key] });
    rsearch.msg = t('addedMsg2');
    saveCfg(); renderSet(); loadBus();
  }
  function addStop(id) {
    var all = cache.stops || [], s = null;
    for (var i = 0; i < all.length; i++) if (all[i].stop === id) { s = all[i]; break; }
    if (!s) return;
    for (var j = 0; j < cfg.stops.length; j++) if (cfg.stops[j].id === id) return;
    cfg.stops.push({ id: id, tc: s.name_tc, en: s.name_en, routes: [] });
    search.msg = t('addedMsg');
    if (!stopRoutes[id] || stopRoutes[id] === 'err') loadStopRoutes(id).then(renderSet);
    saveCfg(); renderSet(); loadBus();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    keepAwake();
    if (!el) { if (e.target === $('set')) closeSet(); return; }
    var a = el.getAttribute('data-act');
    if (a === 'open') openSet();
    else if (a === 'close') closeSet();
    else if (a === 'lang') { cfg.lang = el.getAttribute('data-v'); saveCfg(); applyLang(); renderSet(); refreshAll(); }
    else if (a === 'near') doNear();
    else if (a === 'find') doFind();
    else if (a === 'add') addStop(el.getAttribute('data-id'));
    else if (a === 'rfind') doRouteFind();
    else if (a === 'radd') addRouteStop(el.getAttribute('data-id'), el.getAttribute('data-k'));
    else if (a === 'rm') { var i = +el.getAttribute('data-i'); delete data.bus[cfg.stops[i].id]; cfg.stops.splice(i, 1); saveCfg(); renderSet(); renderBus(); }
    else if (a === 'chip') {
      var s = cfg.stops[+el.getAttribute('data-i')], k = el.getAttribute('data-k');
      s.routes = s.routes || [];
      var p = s.routes.indexOf(k); if (p >= 0) s.routes.splice(p, 1); else s.routes.push(k);
      saveCfg(); renderSet(); renderBus();
    } else if (a === 'copy') {
      try { navigator.clipboard.writeText(location.href).then(function () { el.textContent = t('copied'); }, function () {}); } catch (err) {}
    }
  });
  $('gear').addEventListener('click', openSet);

  // ---------- keep screen awake (iPadOS 16.4+) ----------
  var lock = null;
  function keepAwake() {
    try { if ('wakeLock' in navigator && !lock) navigator.wakeLock.request('screen').then(function (l) { lock = l; l.addEventListener('release', function () { lock = null; }); }, function () {}); } catch (e) {}
  }
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { keepAwake(); refreshAll(); } });

  // ---------- boot ----------
  function applyLang() {
    document.documentElement.lang = isEn() ? 'en' : 'zh-Hant';
    $('hWx').textContent = t('weather'); $('hWarn').textContent = t('warn'); $('hBus').textContent = t('bus'); $('hRadar').textContent = t('radar'); $('rsub').textContent = t('radarSub');
    tick(); renderWarn(); renderWx(); renderBus(); renderFoot();
  }
  // ---------- radar (HKO lightning + radar, 64 km, cloud-to-ground) ----------
  var RADAR = 'https://www.hko.gov.hk/wxinfo/llis/llisradar/images/lli_64CG_', STEP = 6 * 60e3, NFRAMES = 12;
  var radar = { frames: [], i: 0, hold: 0, latest: 0 };
  function rName(ms) { return new Date(ms + 8 * 3600e3).toISOString().replace(/[-T:]/g, '').slice(0, 12); }
  function rProbe(ms) {
    return new Promise(function (res) { var im = new Image(); im.onload = function () { res(im); }; im.onerror = function () { res(null); }; im.src = RADAR + rName(ms) + '.png'; });
  }
  function loadRadar() {
    var t0 = Math.floor(Date.now() / STEP) * STEP;
    function find(k) {
      if (k > 15) return Promise.resolve(0);
      return rProbe(t0 - k * STEP).then(function (im) { return im ? t0 - k * STEP : find(k + 1); });
    }
    return find(0).then(function (latest) {
      if (!latest || latest === radar.latest) return;
      var times = []; for (var k = NFRAMES - 1; k >= 0; k--) times.push(latest - k * STEP);
      return Promise.all(times.map(rProbe)).then(function (ims) {
        var box = $('rmap'), frames = [];
        box.innerHTML = '';
        ims.forEach(function (im, j) { if (im) { box.appendChild(im); frames.push({ t: times[j], el: im }); } });
        radar.frames = frames; radar.latest = latest; radar.i = frames.length - 1; radar.hold = 0;
        $('rdots').innerHTML = frames.map(function () { return '<i></i>'; }).join('');
        showFrame(); fitRadar();
      });
    }).catch(function () {});
  }
  function fitRadar() {
    var m = $('rmap'), c = $('radarCard'); if (!m) return;
    var hgt = m.clientHeight;
    if (hgt > 20) m.style.width = hgt + 'px';   // keep the map square; never hide it
  }
  window.addEventListener('resize', fitRadar);
  function showFrame() {
    var f = radar.frames; if (!f.length) return;
    f.forEach(function (x, j) { x.el.className = j === radar.i ? 'on' : ''; });
    Array.prototype.forEach.call($('rdots').children, function (d, j) { d.className = j === radar.i ? 'on' : ''; });
    $('rtime').textContent = hhmm(new Date(f[radar.i].t));
  }
  function stepRadar() {
    var f = radar.frames; if (f.length < 2) return;
    if (radar.i === f.length - 1 && radar.hold < 3) { radar.hold++; return; }   // pause on the latest frame
    radar.hold = 0; radar.i = (radar.i + 1) % f.length; showFrame();
  }

  function refreshAll() { loadWarn(); loadNow(); loadFc(); loadBus(); loadRadar(); }

  applyLang();
  refreshAll();
  setInterval(tick, EVERY.tick);
  setInterval(loadBus, EVERY.bus);
  setInterval(loadWarn, EVERY.warn);
  setInterval(loadNow, EVERY.now);
  setInterval(loadFc, EVERY.fc);
  setInterval(loadRadar, 3 * 60e3);
  setInterval(stepRadar, 700);
  setInterval(fitRadar, 5000);
  setInterval(renderBus, 15e3);   // keep "x min" counting down between fetches
  setTimeout(function () { if (navigator.onLine !== false) location.reload(); }, EVERY.reload);
  keepAwake();
})();
</script>
</body>
</html>
